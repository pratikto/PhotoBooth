name: Post-preview QRIS private state

on:
  push:
    branches: [feature/post-preview-qris-checkout]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [feature/post-preview-qris-checkout]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-preview-qris-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-state:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline model dependencies
        run: python -m pip install Pillow numpy requests 'qrcode[pil]>=7.4,<9'
      - name: Private draft and original paid-first regression (no devices/network)
        run: python tools/run_kiosk_unittests.py test_post_preview_store test_checkout_backend test_checkout_durability test_payment_quote test_workflow test_capture_journal test_photo_reconstruction
