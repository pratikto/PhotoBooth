name: Post-preview QRIS private state

on:
  push:
    branches: [feature/post-preview-qris-checkout]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [feature/post-preview-qris-checkout]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-preview-qris-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-state:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Retain every durable/fsync test; Windows needs a bounded larger budget.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 15 || 10 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline model dependencies
        run: python -m pip install Pillow numpy requests tzdata 'qrcode[pil]>=7.4,<9' 'opencv-python-headless>=4.10,<5' 'python-escpos[usb]' -r requirements-post-preview.txt -r requirements-qris.txt
      - name: Read-only Drive readiness and original Apps Script regression (offline VM)
        shell: bash
        run: |
          node --check < apps_script/Code.gs
          node --test tests/test_apps_script_retention.cjs
      - name: Private draft and original paid-first regression (no devices/network)
        run: python tools/run_kiosk_unittests.py test_post_preview_store test_post_preview_photos test_post_preview_checkout test_post_preview_resources test_post_preview_worker test_post_preview_idle test_credential_vault test_post_preview_ccp test_post_preview_payments test_post_preview_api test_post_preview_host test_post_preview_presentation test_post_preview_ticket_presentation test_post_preview_remote_receipt test_post_preview_payment_crashes test_post_preview_process_crash test_post_preview_protected_restore test_post_preview_checkout_worker test_post_preview_lifecycle_worker test_post_preview_readiness test_post_preview_drive_readiness test_post_preview_paid_drive test_post_preview_paid_media test_post_preview_paid_strips test_post_preview_paid_print test_post_preview_paid_upload_status test_post_preview_paid_delivery test_post_preview_checkout_delivery test_post_preview_journey_matrix test_post_preview_pilot_launcher test_post_preview_pilot_preflight test_post_preview_device_entry test_post_preview_pilot_early_root test_post_preview_isolation test_post_preview_pilot_admission test_post_preview_refund_assessment test_post_preview_refund_simulation test_post_preview_claim test_post_preview_authority test_post_preview_ticket test_post_preview_ticket_receipt test_post_preview_ticket_window test_post_preview_checkout_ticket test_booth_sync test_booth_storage test_apps_script_drive test_retention_readiness test_checkout_backend test_checkout_durability test_payment_quote test_workflow test_capture_journal test_photo_reconstruction

      - name: Windows owner entry setup and no-device preflight
        if: runner.os == 'Windows' && github.ref == 'refs/heads/feature/post-preview-qris-checkout'
        shell: pwsh
        run: |
          & ./Start-PostPreviewDeviceTest.ps1 -Setup -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'Owner device entry preflight failed' }


  private-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KIVY_NO_ARGS: '1'
      KIVY_NO_CONSOLELOG: '1'
      SDL_AUDIODRIVER: dummy
      LIBGL_ALWAYS_SOFTWARE: '1'
      PHOTOBOOTH_LOCAL_ONLY: '1'
      PHOTOBOOTH_CAMERA: '0'
      PHOTOBOOTH_AUDIO: '0'
      PHOTOBOOTH_AD_VIDEO: '0'
      PHOTOBOOTH_FACE_TRIGGER: '0'
      PHOTOBOOTH_PALM_TRIGGER: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original native portrait dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1 libegl1 libmtdev1 libxkbcommon0
          python -m pip install 'Kivy>=2.3.1,<3' 'ffpyplayer==4.5.3' Pillow numpy requests tzdata 'qrcode[pil]>=7.4,<9' 'opencv-python-headless>=4.10,<5' 'python-escpos[usb]' -r requirements-post-preview.txt -r requirements-qris.txt
      - name: Private preview native flow and original photo regression
        run: xvfb-run -a python tools/run_kiosk_unittests.py test_post_preview_widgets test_post_preview_checkout_widgets test_post_preview_native_journeys test_post_preview_pilot_runtime test_post_preview_ticket_view test_post_preview_remote_ticket_view test_post_preview_remote_receipt_view test_ccp_view test_qr_code test_kiosk_v2_photos test_kiosk_v2_flow
      - name: Linux owner entry no-device preflight
        if: github.ref == 'refs/heads/feature/post-preview-qris-checkout'
        run: python tools/start_post_preview_device_test.py --check-only
      - name: Synthetic screenshots in separate fresh display processes
        run: |
          xvfb-run -a -s '-screen 0 1600x1600x24' python tools/render_post_preview_private.py --width 800 --height 1280 --output-dir /tmp/meong-private-preview
          xvfb-run -a -s '-screen 0 1280x1024x24' python tools/render_post_preview_private.py --width 452 --height 900 --output-dir /tmp/meong-private-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meong-private-preview-synthetic
          path: /tmp/meong-private-preview
          if-no-files-found: ignore
          retention-days: 7
