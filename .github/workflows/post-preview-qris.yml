name: Post-preview QRIS private state

on:
  push:
    branches: [feature/post-preview-qris-checkout]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [feature/post-preview-qris-checkout]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-preview-qris-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-state:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            suite: all
          - os: windows-latest
            suite: core
          - os: windows-latest
            suite: delivery
    runs-on: ${{ matrix.os }}
    env:
      MEONG_CI_PROGRESS: '1'
    # Retain every durable/fsync test; Windows needs a bounded larger budget.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 15 || 10 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline model dependencies
        run: python -m pip install Pillow numpy requests tzdata 'qrcode[pil]>=7.4,<9' 'opencv-python-headless>=4.10,<5' 'python-escpos[usb]' -r requirements-post-preview.txt -r requirements-qris.txt
      - name: Read-only Drive readiness and original Apps Script regression (offline VM)
        shell: bash
        run: |
          node --check < apps_script/Code.gs
          node --test tests/test_apps_script_retention.cjs
      - name: Private draft and original paid-first regression (no devices/network)
        run: python tools/run_post_preview_ci.py ${{ matrix.suite }}

      - name: Windows owner entry setup and no-device preflight
        if: runner.os == 'Windows' && matrix.suite == 'delivery' && github.ref == 'refs/heads/feature/post-preview-qris-checkout'
        shell: pwsh
        run: |
          & ./Start-PostPreviewDeviceTest.ps1 -Setup -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'Owner device entry preflight failed' }
          # This runner has no merchant/Drive settings. The new protected entry
          # must parse/select the same venv and fail closed before native I/O.
          & ./Start-PostPreviewSandbox.ps1 -StorageRoot (Join-Path $env:RUNNER_TEMP 'meong-protected-check') -CheckOnly
          if ($LASTEXITCODE -ne 2) { throw 'Unconfigured protected entry did not fail closed' }
          $global:LASTEXITCODE = 0
          # Explicit local-only NEW-BOOTH enrollment with public fixture values.
          # No backend, device, provider or Drive operation is launched here.
          $env:MIDTRANS_MERCHANT_ID = 'MCIENROLL'
          $env:MIDTRANS_SERVER_KEY = 'Mid-server-CI-ENROLLMENT-FIXTURE'
          $env:PHOTOBOOTH_WEB_APP_URL = 'https://script.google.com/macros/s/CI_ENROLLMENT_FIXTURE/exec'
          $env:PHOTOBOOTH_UPLOAD_TOKEN = 'synthetic-ci-enrollment-token'
          $env:PHOTOBOOTH_PRINTER_WINDOWS_NAME = 'CI enrollment fixture - no device access'
          & ./Start-PostPreviewSandbox.ps1 -StorageRoot (Join-Path $env:RUNNER_TEMP 'meong-protected-check') -SetupOnly -EnrollNewBooth -SandboxOnly
          if ($LASTEXITCODE -ne 0) { throw 'Explicit local new-booth enrollment failed' }
          & ./Start-PostPreviewSandbox.ps1 -StorageRoot (Join-Path $env:RUNNER_TEMP 'meong-protected-check') -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'Enrolled local history preflight failed' }


  private-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KIVY_NO_ARGS: '1'
      KIVY_NO_CONSOLELOG: '1'
      SDL_AUDIODRIVER: dummy
      LIBGL_ALWAYS_SOFTWARE: '1'
      PHOTOBOOTH_LOCAL_ONLY: '1'
      PHOTOBOOTH_CAMERA: '0'
      PHOTOBOOTH_AUDIO: '0'
      PHOTOBOOTH_AD_VIDEO: '0'
      PHOTOBOOTH_FACE_TRIGGER: '0'
      PHOTOBOOTH_PALM_TRIGGER: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original native portrait dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1 libegl1 libmtdev1 libxkbcommon0
          python -m pip install 'Kivy>=2.3.1,<3' 'ffpyplayer==4.5.3' Pillow numpy requests tzdata 'qrcode[pil]>=7.4,<9' 'opencv-python-headless>=4.10,<5' 'python-escpos[usb]' -r requirements-post-preview.txt -r requirements-qris.txt
      - name: Private preview native flow and original photo regression
        run: xvfb-run -a python tools/run_kiosk_unittests.py test_post_preview_widgets test_post_preview_checkout_widgets test_post_preview_native_journeys test_post_preview_pilot_runtime test_post_preview_ticket_view test_post_preview_remote_ticket_view test_post_preview_remote_receipt_view test_post_preview_protected_widgets test_post_preview_visits_widgets test_post_preview_freeze_widgets test_post_preview_windows_widgets test_ccp_view test_qr_code test_kiosk_v2_photos test_kiosk_v2_flow
      - name: Linux owner entry no-device preflight
        if: github.ref == 'refs/heads/feature/post-preview-qris-checkout'
        run: python tools/start_post_preview_device_test.py --check-only
      - name: Synthetic screenshots in separate fresh display processes
        run: |
          xvfb-run -a -s '-screen 0 1600x1600x24' python tools/render_post_preview_private.py --width 800 --height 1280 --output-dir /tmp/meong-private-preview
          xvfb-run -a -s '-screen 0 1280x1024x24' python tools/render_post_preview_private.py --width 452 --height 900 --output-dir /tmp/meong-private-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meong-private-preview-synthetic
          path: /tmp/meong-private-preview
          if-no-files-found: ignore
          retention-days: 7
