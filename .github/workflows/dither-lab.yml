name: Dither tuning lab regression

on:
  push:
    branches: [feature/dither-tuning]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow only (offline lab backend)
        run: python -m pip install "Pillow>=10,<13"
      - name: Compile tuning lab and tests
        run: python -m py_compile photobooth/dither_lab.py photobooth/dizzy_calibration.py photobooth/dither_processing.py photobooth/dizzy_dither.py photobooth/dither_autotune.py tools/dither_tuning_gui.py tools/dither_compare_gui.py tools/dizzy_fidelity.py tests/test_dither_lab.py tests/test_dither_comparison.py tests/test_dither_print.py tests/test_dither_gui_layout.py tests/test_dizzy_dither.py tests/test_dizzy_lab_integration.py tests/test_dither_enhanced.py tests/test_dither_gui_runtime.py tests/test_dither_autotune.py tests/test_dither_processing.py tests/test_dizzy_fidelity.py photobooth/dither_print.py photobooth/printer.py
      - name: Run targeted printer-processing regressions
        run: python -m unittest tests.test_dither_lab tests.test_dither_comparison tests.test_dither_print tests.test_dither_gui_layout tests.test_dizzy_dither tests.test_dizzy_lab_integration tests.test_dither_enhanced tests.test_dither_autotune tests.test_dither_processing tests.test_dizzy_fidelity -v
      - name: Run Tk GUI runtime smoke with Xvfb (no physical printing)
        run: xvfb-run -a python -m unittest tests.test_dither_gui_runtime -v

      - name: Measure all 256 grayscale levels (both CPU Dizzy variants)
        run: python tools/dizzy_fidelity.py --width 96 --height 96 --seed 42 --output-dir /tmp/meong-dizzy-fidelity --assert-improvement
      - name: Upload 256-tone fidelity plots and measurements
        uses: actions/upload-artifact@v4
        with:
          name: meong-dizzy-cpu-fidelity-256
          path: /tmp/meong-dizzy-fidelity/
          if-no-files-found: error
