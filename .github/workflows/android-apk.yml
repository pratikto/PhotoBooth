name: Build Android debug APK
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    if: github.ref == 'refs/heads/feature/portrait-kiosk-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake libffi-dev libssl-dev zlib1g-dev
          python -m venv work/android-build-venv
          work/android-build-venv/bin/python -m pip install -r android/requirements-build.txt
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Verify packaging policy
        run: python -S -m unittest tests.test_android_preview -v
      - name: Compile curated offline APK
        run: |
          set -o pipefail
          work/android-build-venv/bin/python tools/build_android.py \
            --sdk-dir "$ANDROID_HOME" --ndk-dir "$ANDROID_HOME/ndk/28.2.13676358" \
            --accept-sdk-license 2>&1 | tee work/android-build.log
      - name: Verify APK signature and manifest
        run: |
          APK=$(find work/android-project/bin -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > work/apk-manifest.txt
          sha256sum "$APK" > work/apk-sha256.txt
      - name: Reject foreign native libraries including the Python payload
        run: |
          python - <<'PY'
          import io, struct, tarfile, zipfile
          from pathlib import Path
          apk = next(Path('work/android-project/bin').glob('*.apk'))
          count = 0
          def check(name, blob):
              global count
              assert blob[:4] == b'\x7fELF' and struct.unpack_from('<H', blob, 18)[0] == 183, name
              count += 1
          with zipfile.ZipFile(apk) as archive:
              for name in archive.namelist():
                  if name.startswith('lib/') and name.endswith('.so'):
                      blob = archive.read(name)
                      if name.endswith('/libpybundle.so'):
                          with tarfile.open(fileobj=io.BytesIO(blob), mode='r:*') as bundle:
                              for entry in bundle.getmembers():
                                  if entry.name.endswith('.so'):
                                      check(entry.name, bundle.extractfile(entry).read())
                      else:
                          check(name, blob)
          assert count > 0
          print(f'Verified {count} AArch64 ELF libraries, including Python extensions')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meong-android-debug
          path: |
            work/android-project/bin/*.apk
            work/android-project/android-source-manifest.json
            work/android-build.log
            work/apk-manifest.txt
            work/apk-sha256.txt
          retention-days: 7
