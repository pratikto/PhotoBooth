name: Build Android debug APK
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    if: github.ref == 'refs/heads/feature/portrait-kiosk-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake libffi-dev libssl-dev zlib1g-dev
          python -m venv work/android-build-venv
          work/android-build-venv/bin/python -m pip install -r android/requirements-build.txt
          # ubuntu-24.04 already supplies ANDROID_HOME and official command-line
          # tools. Reuse them instead of downloading a second SDK via an action.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses < <(yes) > /dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Verify packaging policy
        run: python -S -m unittest tests.test_android_preview tests.test_android_apk -v
      - name: Compile curated Android v2 APK
        run: |
          set -o pipefail
          work/android-build-venv/bin/python tools/build_android.py \
            --sdk-dir "$ANDROID_HOME" --ndk-dir "$ANDROID_HOME/ndk/28.2.13676358" \
            --accept-sdk-license 2>&1 | tee work/android-build.log
      - name: Verify APK signature and manifest
        run: |
          APK=$(find work/android-project/bin -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > work/apk-manifest.txt
          sha256sum "$APK" > work/apk-sha256.txt
      - name: Verify runtime package, permissions and nested ARM libraries
        run: |
          APK=$(find work/android-project/bin -maxdepth 1 -name '*.apk' -print -quit)
          python tools/verify_android_apk.py "$APK" --badging work/apk-manifest.txt \
            --spec work/android-project/buildozer.spec --output work/apk-verification.json
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK" > work/apk-alignment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meong-android-debug
          path: |
            work/android-project/bin/*.apk
            work/android-project/android-source-manifest.json
            work/android-build.log
            work/apk-manifest.txt
            work/apk-sha256.txt
            work/apk-verification.json
            work/apk-alignment.txt
          retention-days: 7
