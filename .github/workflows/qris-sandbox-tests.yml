name: QRIS Sandbox Unit Tests

on:
  push:
    branches:
      - feature/qris-payment
    paths:
      - "photobooth/payment_*.py"
      - "photobooth/midtrans_*.py"
      - "photobooth/checkout_service.py"
      - "photobooth/booth_auth.py"
      - "photobooth/qris_api.py"
      - "tests/test_payment_*.py"
      - "tests/test_midtrans_*.py"
      - "tests/test_checkout_service.py"
      - "tests/test_booth_auth.py"
      - "tests/test_qris_api.py"
      - ".github/workflows/qris-sandbox-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-qris:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test dependencies
        run: python -m pip install "pillow>=10,<12" "fastapi>=0.115,<1" "httpx>=0.27,<1"
      - name: Run offline QRIS regression tests
        run: |
          python -m unittest discover -s tests -p "test_payment_*.py" -v
          python -m unittest discover -s tests -p "test_midtrans_*.py" -v
          python -m unittest discover -s tests -p "test_checkout_service.py" -v
          python -m unittest discover -s tests -p "test_booth_auth.py" -v
          python -m unittest discover -s tests -p "test_qris_api.py" -v
