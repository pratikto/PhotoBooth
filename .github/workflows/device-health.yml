name: FEAT-008 device health unit tests

on:
  push:
    branches: [feature/device-health, master]
    paths:
      - photobooth/device_health.py
      - tests/test_device_health.py
      - .github/workflows/device-health.yml
  pull_request:
    branches: [master]
    paths:
      - photobooth/device_health.py
      - tests/test_device_health.py
      - .github/workflows/device-health.yml
  workflow_dispatch:

# No printer, camera, payment service, Kivy GUI, media decoder, or Drive
# credentials are used. Every health adapter is injected/mocked by the tests.
permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile independent health module and tests
        run: python -m compileall -q photobooth/device_health.py tests/test_device_health.py
      - name: Run isolated FEAT-008 Stage A tests (no hardware)
        run: python -m unittest discover -s tests -p 'test_device_health.py' -v
      - name: Verify heterogeneous platform adapter capabilities
        run: python -m unittest discover -s tests -p 'test_hardware_adapters.py' -v
      - name: Verify safe read-only platform hardware discovery
        run: python -m unittest discover -s tests -p 'test_hardware_discovery.py' -v
