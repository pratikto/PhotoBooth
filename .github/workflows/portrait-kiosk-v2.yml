name: Portrait kiosk v2 prototype checks

on:
  push:
    branches: [feature/portrait-kiosk-gui]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure:
    name: Navigation and audio lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax
        run: python -m compileall -q photobooth/kiosk_v2 tools/run_portrait_v2.py tests/test_kiosk_v2_*.py
      - name: Kivy-independent navigation and fake audio tests
        run: python -m unittest tests.test_kiosk_v2_flow tests.test_kiosk_v2_audio -v

  desktop:
    name: Synthetic Kivy screen/nav smoke (no hardware)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
      PHOTOBOOTH_AUDIO: "0"
      PHOTOBOOTH_AD_VIDEO: "0"
      SDL_AUDIODRIVER: dummy
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install minimum desktop simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1 libegl1 libmtdev1 libxkbcommon0
          python -m pip install "Kivy>=2.3.1,<3" Pillow tzdata "ffpyplayer>=4.5,<5"
      - name: Exercise opt-in Kivy widgets at a virtual display
        run: xvfb-run -a python -m unittest tests.test_kiosk_v2_widgets -v

# These are synthetic checks. Real Windows music audibility, video decoder,
# face camera, thermal output, actual QRIS and end-to-end UI are NOT certified.
