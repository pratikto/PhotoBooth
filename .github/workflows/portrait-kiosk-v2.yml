name: Portrait kiosk v2 prototype checks

on:
  push:
    branches: [feature/portrait-kiosk-gui, feature/portrait-kiosk-v2-next]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portrait-kiosk-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure:
    name: Navigation and audio lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax
        run: python -m compileall -q photobooth/kiosk_v2 tools/run_portrait_v2.py tools/render_portrait_v2.py tools/render_portrait_p3.py tools/render_portrait_p4.py tools/render_portrait_checkout.py tests/test_kiosk_v2_*.py
      - name: Apps Script retention activation and scoped cleanup (offline VM)
        run: |
          node --check < apps_script/Code.gs
          node --test tests/test_apps_script_retention.cjs
      - name: Kivy-independent navigation and fake audio tests
        # Watchdog fixtures never launch a camera, payment service or printer.
        run: python -m unittest tests.test_kiosk_v2_flow tests.test_kiosk_v2_audio tests.test_kiosk_v2_design_tokens tests.test_kiosk_v2_previews tests.test_kiosk_v2_live_preview tests.test_kiosk_v2_sensors tests.test_kiosk_v2_diagnostics tests.test_kiosk_v2_readiness tests.test_kiosk_v2_devices tests.test_kiosk_v2_game_engine tests.test_kiosk_v2_demo_game tests.test_kiosk_v2_mock_checkout tests.test_kiosk_v2_game_offer tests.test_kiosk_v2_meong_reference.ReferenceSourceTests tests.test_kiosk_v2_health_reference tests.test_kiosk_v2_delivery_options -v
      - name: Observation-only supervisor and startup safety
        run: python -m unittest tests.test_kiosk_v2_watchdog tests.test_kiosk_v2_recovery -v

  desktop:
    name: Synthetic Kivy screen/nav smoke (no hardware)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
      PHOTOBOOTH_AUDIO: "0"
      PHOTOBOOTH_AD_VIDEO: "0"
      PHOTOBOOTH_CAMERA: "0"
      PHOTOBOOTH_FACE_TRIGGER: "0"
      PHOTOBOOTH_PALM_TRIGGER: "0"
      SDL_AUDIODRIVER: dummy
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install minimum desktop simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1 libegl1 libmtdev1 libxkbcommon0
          python -m pip install "Kivy>=2.3.1,<3" Pillow tzdata "ffpyplayer>=4.5,<5" "opencv-python-headless>=4.10,<5" requests "qrcode[pil]>=7.4,<9"
          python -m pip install -r requirements-qris.txt
      - name: Load the bundled offline face detector and check hold/cooldown policy
        run: python -m unittest tests.test_face_presence -v
      - name: Isolated P3 photo, composition, retake and durable print guards
        run: MEONG_CI_TEST_REPORT=/tmp/meong-portrait-v2/reports/delivery-tests.txt python tools/run_kiosk_unittests.py test_kiosk_v2_photos test_kiosk_v2_photo_delivery test_retention test_apps_script_drive test_retention_readiness test_workflow test_templates test_booth_storage test_booth_sync test_content_cache
      - name: Reused QRIS protocol and native v2 Sandbox handoff (offline only)
        run: |
          MEONG_CI_TEST_REPORT=/tmp/meong-portrait-v2/reports/sandbox-tests.txt xvfb-run -a python tools/run_kiosk_unittests.py test_checkout_backend test_checkout_durability test_booth_auth test_qris_api test_qris_http_v2 test_qris_session test_qris_kiosk_client test_qris_images test_midtrans_sandbox test_midtrans_verify test_payment_quote test_qris_sandbox_launcher test_kiosk_v2_sandbox test_kiosk_v2_sandbox_widgets
      - name: Reuse original v1 read-only health backend and v2 bridge (fixtures)
        run: MEONG_CI_TEST_REPORT=/tmp/meong-portrait-v2/reports/health-tests.txt xvfb-run -a python tools/run_kiosk_unittests.py test_device_health test_device_recovery test_device_selection test_hardware_adapters test_hardware_discovery test_kiosk_v2_health_service test_kiosk_v2_health_reference
      - name: Exercise opt-in Kivy widgets at a virtual display
        run: MEONG_CI_TEST_REPORT=/tmp/meong-portrait-v2/reports/native-tests.txt PHOTOBOOTH_TEST_AUDIO=1 xvfb-run -a python tools/run_kiosk_unittests.py tests.test_kiosk_v2_widgets tests.test_kiosk_v2_game_widgets tests.test_kiosk_v2_checkout_widgets tests.test_kiosk_v2_meong_reference tests.test_kiosk_v2_game_followup tests.test_kiosk_v2_brand_flight tests.test_kiosk_v2_button_art tests.test_kiosk_v2_operator_widgets tests.test_kiosk_v2_delivery_widgets
      - name: Verify unchanged latest Meong Fly modules and original regression suite
        run: xvfb-run -a python -m unittest discover -s tests -p 'test_meong_fly*.py' -v
      - name: Reuse muted native channels across twenty audio cycles (dummy PCM output)
        run: PHOTOBOOTH_TEST_AUDIO=1 xvfb-run -a python -m unittest tests.test_kiosk_v2_native_audio tests.test_kiosk_v2_game_music -v
      - name: Capture real Kivy pages at 800x1280 (fresh Xvfb process)
        run: xvfb-run -a -s "-screen 0 1600x1600x24" python tools/render_portrait_v2.py --output-dir /tmp/meong-portrait-v2 --width 800 --height 1280
      - name: Capture compact Kivy pages at 452x900 (RGB readback-aligned)
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python tools/render_portrait_v2.py --output-dir /tmp/meong-portrait-v2 --width 452 --height 900 --motion
      - name: Capture short-window Kivy pages at 360x640 and 800x600
        run: |
          xvfb-run -a python tools/render_portrait_v2.py --output-dir /tmp/meong-portrait-v2 --width 360 --height 640
          xvfb-run -a python tools/render_portrait_v2.py --output-dir /tmp/meong-portrait-v2 --width 800 --height 600
      - name: Capture P3 photo pages with an isolated store and synthetic camera
        run: |
          xvfb-run -a -s "-screen 0 1600x1600x24" python tools/render_portrait_p3.py --output-dir /tmp/meong-portrait-v2/p3 --width 800 --height 1280
          xvfb-run -a -s "-screen 0 1280x1024x24" python tools/render_portrait_p3.py --output-dir /tmp/meong-portrait-v2/p3 --width 452 --height 900
      - name: Capture automatic print and background Drive using offline fixtures
        run: |
          xvfb-run -a -s "-screen 0 1600x1600x24" python tools/render_portrait_p3.py --delivery --output-dir /tmp/meong-portrait-v2/delivery --width 800 --height 1280
          xvfb-run -a -s "-screen 0 1280x1024x24" python tools/render_portrait_p3.py --delivery --output-dir /tmp/meong-portrait-v2/delivery --width 452 --height 900
      - name: Capture P4 DEMO game pages with isolated attempt ledger
        run: |
          xvfb-run -a -s "-screen 0 1600x1600x24" python tools/render_portrait_p4.py --output-dir /tmp/meong-portrait-v2/p4 --width 800 --height 1280
          xvfb-run -a -s "-screen 0 1280x1024x24" python tools/render_portrait_p4.py --output-dir /tmp/meong-portrait-v2/p4 --width 452 --height 900
      - name: Capture isolated P4b MOCK checkout states (never a payment provider)
        run: |
          PHOTOBOOTH_V2_CHECKOUT_MOCK=1 xvfb-run -a -s "-screen 0 1600x1600x24" python tools/render_portrait_checkout.py --output-dir /tmp/meong-portrait-v2/p4b --width 800 --height 1280
          PHOTOBOOTH_V2_CHECKOUT_MOCK=1 xvfb-run -a -s "-screen 0 1280x1024x24" python tools/render_portrait_checkout.py --output-dir /tmp/meong-portrait-v2/p4b --width 452 --height 900
      - name: Capture native Sandbox views with offline HTTP fixtures (not merchant acceptance)
        run: |
          xvfb-run -a -s "-screen 0 1600x1600x24" python tools/render_portrait_sandbox.py --output-dir /tmp/meong-portrait-v2/sandbox --width 800 --height 1280
          xvfb-run -a -s "-screen 0 1280x1024x24" python tools/render_portrait_sandbox.py --output-dir /tmp/meong-portrait-v2/sandbox --width 452 --height 900
      - name: Capture original v1 operator health panel in v2 (offline fixtures)
        run: |
          xvfb-run -a -s "-screen 0 1600x1600x24" python tools/render_portrait_health.py --output-dir /tmp/meong-portrait-v2/health --width 800 --height 1280
          xvfb-run -a -s "-screen 0 1280x1024x24" python tools/render_portrait_health.py --output-dir /tmp/meong-portrait-v2/health --width 452 --height 900
      - name: Preserve visual evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meong-portrait-v2-screens
          path: /tmp/meong-portrait-v2
          if-no-files-found: ignore
          retention-days: 7

  windows-audio:
    name: Windows Python 3.12 native SDL audio (dummy output)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
      SDL_AUDIODRIVER: dummy
      PHOTOBOOTH_TEST_AUDIO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Windows native providers
        run: python -m pip install "Kivy>=2.3.1,<3" "ffpyplayer>=4.5,<5" Pillow
      - name: Check portable startup, recovery holds and Windows launch ownership
        env:
          MEONG_CI_TEST_REPORT: ${{ runner.temp }}/meong-recovery-tests.txt
        run: |
          python -S tools/run_kiosk_unittests.py test_kiosk_v2_watchdog test_kiosk_v2_recovery
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $report = (Get-Content -Raw $env:MEONG_CI_TEST_REPORT).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Portable startup recovery regression::$report"
          }
          exit $testExit
      - name: Check Windows DLL loading, safe WAV fallback and twenty PCM cycles
        run: python -m unittest tests.test_kiosk_v2_audio tests.test_kiosk_v2_native_audio tests.test_kiosk_v2_diagnostics tests.test_kiosk_v2_readiness tests.test_kiosk_v2_devices tests.test_kiosk_v2_live_preview tests.test_kiosk_v2_sensors tests.test_kiosk_v2_game_engine tests.test_kiosk_v2_demo_game tests.test_kiosk_v2_mock_checkout tests.test_booth_storage -v
      - name: Preserve Windows portable startup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meong-windows-recovery-tests
          path: ${{ runner.temp }}/meong-recovery-tests.txt
          if-no-files-found: ignore
          retention-days: 7

# These are synthetic checks. Real Windows music audibility, video decoder,
# face camera, thermal output, actual QRIS and end-to-end UI are NOT certified.
