name: Portrait kiosk v2 prototype checks

on:
  push:
    branches: [feature/portrait-kiosk-gui, feature/portrait-kiosk-v2-next]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure:
    name: Navigation and audio lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax
        run: python -m compileall -q photobooth/kiosk_v2 tools/run_portrait_v2.py tools/render_portrait_v2.py tests/test_kiosk_v2_*.py
      - name: Kivy-independent navigation and fake audio tests
        run: python -m unittest tests.test_kiosk_v2_flow tests.test_kiosk_v2_audio tests.test_kiosk_v2_design_tokens tests.test_kiosk_v2_previews tests.test_kiosk_v2_diagnostics tests.test_kiosk_v2_devices -v

  desktop:
    name: Synthetic Kivy screen/nav smoke (no hardware)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
      PHOTOBOOTH_AUDIO: "0"
      PHOTOBOOTH_AD_VIDEO: "0"
      PHOTOBOOTH_CAMERA: "0"
      PHOTOBOOTH_FACE_TRIGGER: "0"
      SDL_AUDIODRIVER: dummy
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install minimum desktop simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1 libegl1 libmtdev1 libxkbcommon0
          python -m pip install "Kivy>=2.3.1,<3" Pillow tzdata "ffpyplayer>=4.5,<5" "opencv-python-headless>=4.10,<5" requests
      - name: Load the bundled offline face detector and check hold/cooldown policy
        run: python -m unittest tests.test_face_presence -v
      - name: Exercise opt-in Kivy widgets at a virtual display
        run: PHOTOBOOTH_TEST_AUDIO=1 xvfb-run -a python -m unittest tests.test_kiosk_v2_widgets -v
      - name: Reuse muted native channels across twenty audio cycles (dummy PCM output)
        run: PHOTOBOOTH_TEST_AUDIO=1 xvfb-run -a python -m unittest tests.test_kiosk_v2_native_audio -v
      - name: Capture real Kivy pages at 800x1280 (fresh Xvfb process)
        run: xvfb-run -a -s "-screen 0 1600x1600x24" python tools/render_portrait_v2.py --output-dir /tmp/meong-portrait-v2 --width 800 --height 1280
      - name: Capture compact Kivy pages at 452x900 (RGB readback-aligned)
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python tools/render_portrait_v2.py --output-dir /tmp/meong-portrait-v2 --width 452 --height 900 --motion
      - name: Capture short-window Kivy pages at 360x640 and 800x600
        run: |
          xvfb-run -a python tools/render_portrait_v2.py --output-dir /tmp/meong-portrait-v2 --width 360 --height 640
          xvfb-run -a python tools/render_portrait_v2.py --output-dir /tmp/meong-portrait-v2 --width 800 --height 600
      - name: Preserve visual evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meong-portrait-v2-screens
          path: /tmp/meong-portrait-v2
          if-no-files-found: ignore
          retention-days: 7

  windows-audio:
    name: Windows Python 3.12 native SDL audio (dummy output)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
      SDL_AUDIODRIVER: dummy
      PHOTOBOOTH_TEST_AUDIO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Windows native providers
        run: python -m pip install "Kivy>=2.3.1,<3" "ffpyplayer>=4.5,<5"
      - name: Check Windows DLL loading, safe WAV fallback and twenty PCM cycles
        run: python -m unittest tests.test_kiosk_v2_audio tests.test_kiosk_v2_native_audio tests.test_kiosk_v2_diagnostics tests.test_kiosk_v2_devices -v

# These are synthetic checks. Real Windows music audibility, video decoder,
# face camera, thermal output, actual QRIS and end-to-end UI are NOT certified.
