name: FEAT-021 background processing (offline synthetic)
on:
  push:
    branches: [feature/ai-background-studio]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  background-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow only; no model or network inference
        run: python -m pip install "Pillow>=10,<13"
      - name: Validate background processing syntax
        run: python -m py_compile photobooth/background_studio.py tests/test_background_studio.py
      - name: Run synthetic masks, offline-model readiness and all-or-nothing tests
        run: python -m unittest tests.test_background_studio -v
